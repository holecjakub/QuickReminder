name: Release

# Builds, signs (Developer ID), notarizes and publishes a GitHub Release when a version tag is pushed.
#
# Required repository secrets (set with Scripts/setup-release-secrets.sh):
#   MACOS_CERTIFICATE        base64 of the "Developer ID Application" .p12
#   MACOS_CERTIFICATE_PWD    password of that .p12
#   KEYCHAIN_PASSWORD        any random password for the ephemeral CI keychain
#   ASC_API_KEY_P8           base64 of the App Store Connect API key (.p8)
#   ASC_KEY_ID               the key's ID
#   ASC_ISSUER_ID            the issuer ID (App Store Connect → Users and Access → Integrations)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (e.g. 1.0.0); a release is created only for tag pushes"
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Sign, notarize, release
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Determine version
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify secrets
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          for v in MACOS_CERTIFICATE ASC_API_KEY_P8 ASC_ISSUER_ID; do
            [[ -n "${!v}" ]] || { echo "::error::secret $v is not set"; exit 1; }
          done

      - name: Import Developer ID certificate
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security import "$RUNNER_TEMP/certificate.p12" -k build.keychain -P "$MACOS_CERTIFICATE_PWD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          rm -f "$RUNNER_TEMP/certificate.p12"
          SIGN_ID="$(security find-identity -v -p codesigning build.keychain | awk '/Developer ID Application/ {print $2; exit}')"
          [[ -n "$SIGN_ID" ]] || { echo "::error::no Developer ID Application identity imported"; exit 1; }
          echo "SIGN_ID=$SIGN_ID" >> "$GITHUB_ENV"

      - name: Unit checks
        run: Scripts/test.sh

      - name: Build (Release, Developer ID, timestamped)
        env:
          VERSION: ${{ steps.version.outputs.version }}
          CONFIGURATION: Release
        run: |
          ./build.sh
          codesign --verify --deep --strict --verbose=2 build/QuickReminder.app
          codesign -dv build/QuickReminder.app 2>&1 | grep -E "Authority=Developer ID" || { echo "::error::not Developer-ID signed"; exit 1; }

      - name: Package (zip + DMG)
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p build/dist
          ditto -c -k --keepParent build/QuickReminder.app "build/dist/QuickReminder-$VERSION.zip"
          STAGE="$(mktemp -d)"
          cp -R build/QuickReminder.app "$STAGE/"
          ln -s /Applications "$STAGE/Applications"
          hdiutil create -volname QuickReminder -srcfolder "$STAGE" -ov -format UDZO -quiet "build/dist/QuickReminder-$VERSION.dmg"
          codesign --force --sign "$SIGN_ID" --timestamp "build/dist/QuickReminder-$VERSION.dmg"

      - name: Notarize + staple
        env:
          VERSION: ${{ steps.version.outputs.version }}
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          echo "$ASC_API_KEY_P8" | base64 --decode > "$RUNNER_TEMP/asc_key.p8"
          for artifact in "build/dist/QuickReminder-$VERSION.zip" "build/dist/QuickReminder-$VERSION.dmg"; do
            xcrun notarytool submit "$artifact" --key "$RUNNER_TEMP/asc_key.p8" --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER_ID" --wait
          done
          rm -f "$RUNNER_TEMP/asc_key.p8"
          xcrun stapler staple build/QuickReminder.app
          ditto -c -k --keepParent build/QuickReminder.app "build/dist/QuickReminder-$VERSION.zip"
          xcrun stapler staple "build/dist/QuickReminder-$VERSION.dmg"
          spctl -a -vv --type exec build/QuickReminder.app
          spctl -a -vv --type open --context context:primary-signature "build/dist/QuickReminder-$VERSION.dmg"
          (cd build/dist && shasum -a 256 *.zip *.dmg > SHA256SUMS.txt && cat SHA256SUMS.txt)

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: QuickReminder-${{ steps.version.outputs.version }}
          path: build/dist/*

      - name: Release notes from CHANGELOG
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          {
            awk -v v="## $VERSION" '$0 ~ "^## " {p = ($0 ~ v)} p' CHANGELOG.md | tail -n +2
            echo
            echo "Signed with Developer ID and notarized by Apple. Requires macOS 26."
            echo
            echo '```'; cat build/dist/SHA256SUMS.txt; echo '```'
          } > build/dist/RELEASE_NOTES.md
          grep -q . build/dist/RELEASE_NOTES.md

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: QuickReminder ${{ steps.version.outputs.version }}
          body_path: build/dist/RELEASE_NOTES.md
          prerelease: ${{ contains(steps.version.outputs.version, '-') }}
          files: |
            build/dist/QuickReminder-${{ steps.version.outputs.version }}.zip
            build/dist/QuickReminder-${{ steps.version.outputs.version }}.dmg
            build/dist/SHA256SUMS.txt

      - name: Clean up keychain
        if: always()
        run: security delete-keychain build.keychain || true
