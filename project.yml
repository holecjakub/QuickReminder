name: QuickReminder
options:
  bundleIdPrefix: com.jholec
  deploymentTarget:
    macOS: "26.0"
  xcodeVersion: "26.5"
  generateEmptyDirectories: true

targets:
  QuickReminder:
    type: application
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: Sources/QuickReminder
        type: group
    resources:
      - path: Resources/Assets.xcassets
    info:
      path: Resources/Info.plist
      properties:
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        LSMinimumSystemVersion: "26.0"
        LSUIElement: true
        NSHighResolutionCapable: true
        NSPrincipalClass: NSApplication
        NSRemindersFullAccessUsageDescription: "QuickReminder needs access to Reminders so you can quickly capture tasks from the floating overlay."
        NSRemindersUsageDescription: "QuickReminder needs access to Reminders so you can quickly capture tasks from the floating overlay."
        CFBundleURLTypes:
          - CFBundleURLName: com.jholec.QuickReminder
            CFBundleURLSchemes:
              - quickreminder
    # Intentionally NOT sandboxed: with com.apple.security.app-sandbox the EventKit XPC
    # connection fails on this machine (macOS 26.6 / Xcode 27, NSMachErrorDomain 4099) and the
    # Reminders TCC prompt never appears. Hardened runtime is applied by build.sh.
    # See PRs/2026-09-18-notch-review.md finding 1.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jholec.QuickReminder
        PRODUCT_NAME: QuickReminder
        SWIFT_VERSION: "6.3"
        MACOSX_DEPLOYMENT_TARGET: "26.0"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        ENABLE_HARDENED_RUNTIME: YES
        SWIFT_STRICT_CONCURRENCY: complete
